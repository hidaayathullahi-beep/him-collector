<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIM — Print setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --g:#0f4c3a; --line:#dcd8cd; --muted:#6b6b6b; }
  *{box-sizing:border-box}
  body{margin:0;background:#f3f1ea;color:#1a1a1a;font-family:'Noto Sans Malayalam',system-ui,sans-serif;padding:18px;line-height:1.5}
  .wrap{max-width:520px;margin:0 auto}
  h1{font-size:19px;color:var(--g);margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;margin:10px 0;font-family:inherit}
  .btn.primary{background:var(--g);color:#fff}
  .btn.ghost{background:#eef2ee;color:var(--g);border:1px solid #cfe0d6}
  .steps{font-size:14px;padding-left:20px;margin:6px 0}
  .steps li{margin:5px 0}
  .status{font-size:14px;margin-top:8px;min-height:20px}
  .ok{color:var(--g);font-weight:700}
  .err{color:#b3261e;font-weight:700}
  .plabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
  #preview{display:block;margin:0 auto;border:1px solid var(--line);background:#fff;max-width:100%;height:auto;image-rendering:pixelated}
</style>
</head>
<body>
<div class="wrap">
  <h1>HIM Collector — Print setup</h1>
  <p class="sub">Final layout · SEZNIK Veer · direct Bluetooth</p>
  <div class="card">
    <b>Do this in order:</b>
    <ol class="steps">
      <li>Veer <b>paired</b> in Bluetooth and switched on.</li>
      <li>Tap <b>Select printer</b> and choose the Veer.</li>
      <li>Tap <b>Print test slip</b>.</li>
    </ol>
    <button class="btn ghost" id="btnPick">🔧 Select printer</button>
    <button class="btn primary" id="btnPrint">🖨️ Print test slip</button>
    <div class="status" id="status"></div>
  </div>
  <div class="card">
    <div class="plabel">This is exactly what prints:</div>
    <canvas id="preview" width="384" height="40"></canvas>
  </div>
  <div class="card">
    <button class="btn ghost" id="btnOpen">➡️ Open the Collector app</button>
  </div>
</div>
<script>
const N=window.HIMNative;
const statusEl=document.getElementById('status');
function setStatus(m,c){statusEl.textContent=m;statusEl.className='status '+(c||'');}
window.HIMNativeResult=function(ok,msg){ok?setStatus('✓ Sent to printer.','ok'):setStatus('✗ '+(msg||'Failed'),'err');};
const LOGO_SRC="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAACRCAAAAAAEbx6GAAADhUlEQVR4nO1c0XLjMAhEnfv/X6YPvTiJAZmFjaNkvC+1pxZsACEhyR4qJAyhiRL5R5IzhMmKRGsIlxWF1hAhs5KfvogXsGLQEqGzItAaBBYGbVpjclcHx4k3Hw4Wr7gn5tLj2F8DWXXyKCnkReRmM0r0M2kR+yOH1nj6QwBrTPyDsqjRnchxJIkWO6eGtAamq8BrpqFrrc1n3Gwf0Rqw8IeHx0hE2FSDL+D+9LH8R8kq2XnOgQaX1l5Tmlapkfew58QR3nhwpGI/xdNASBCGBCF1ObTG9NaBPvPAwtHXwBl8dBNNGq1ZY6JyizLrRGPSZPZqULIaqEN1mYWBpVXtWPkhIaHBiS12zVfRYLJ8KWlv7dCqJNLAii3ytPkdIZ+Aia0VIsudQewdkSOaj62MBpoT1ZdfxKKxRaOFz7JnWDRBhDMIWoEcYpv4O5hZ6/W5IkREi9uxYA2s2NKnP218e4Lg4tMSBITxcLXO2ilWhmdAsNaeB8NgL9lc6Rusay2fQdtgPVqxWZrEWk6cOqvlyYa1jvR2DFamlTFGnVi1fM26KNmUVL6mA6cYYSUnYvsIFUdWrAVaYPJ4yDizsJ9Xg2qPdcBVdSVaDkQQqupSDMONUFovLtJuOGnSjP6amJZ6gVo2lptD464Q0lIvEqkudDX8x7R8ZcL8onr5+r5qHwr5lg+hxl9evpKB0Gr2Q6T5F1jrRFy0EHwBrWbSR5ovai2o8jlvjPwYa9kDBxr8A0YkyNY5QLHPonXmXjUZi9IqVNVnwEkQRzVv4YzP7gWS46o6mbfsIjcK7CTVorF10ULAOwE+23qGkVjfyqEzErzu1Ah5U5h1kvJ+RXEkxVoa3lTBoKXT2xI+5/AwiMpR60Msmk7btFzLtM11kCDMuaTSQSWTNQ6lzK1lXtxR2S0QJ+yiul9UPn4faHpQyryrVsnlto0Ri9HaCfYuOo1nQia0dH/FGfCMWA/FnphmaCMghcnmCiCliMLmynvxVlpx7rqsheCiheCiheCiheCiheCiheDzaSETsPjZXH2y/gL4SWegJrib6PNj60xctBD0e2L1Zdm5UEaCMIs6fYmcvIV81yIlr7358LQBzdjWVhEZhIX0+wYGaVNbZSgjuavIdtabIo/1VpQKjxRPDO9Qwh8WfSW3mSCeP/wCfWhmLrefZ6yJCDLXzPJfvHFXXriNwf74I6k0+AX3L9YMcbrqGAAAAABJRU5ErkJggg==";
const ML="'Noto Sans Malayalam', system-ui, sans-serif", AR="'Noto Sans Arabic', system-ui, sans-serif";
const D={
  masjid:'ഹിദായത്തുൽ ഇസ്ലാം ജുമാ മസ്ജിദ്', reg:'രജി. നം: 2168/97', place:'നാമ്പുകുളങ്ങര, ഇലിപ്പക്കുളം',
  fund:'മാസ സംഭാവന', receipt:'GN-410', date:'18 Sep 2026', id:'HIM _001',
  name:'അബ്ദുൽ റഹ്മാൻ കുഞ്ഞ്', house:'അമ്പഴയിൽ വീട്', amount:'500', dues:'100', by:'ഷംനാദ് . എ',
  dua_ml:'അള്ളാഹു നിങ്ങളുടെ ദാനം സ്വീകരിക്കട്ടെ', dua_ar:'تَقَبَّلَ اللّٰهُ صَدَقَتَكُمْ'
};
const W=384, PADX=28;
const canvas=document.getElementById('preview');
let logoImg=null;
function loadLogo(){return new Promise(r=>{const i=new Image();i.onload=()=>{logoImg=i;r();};i.onerror=()=>r();i.src=LOGO_SRC;});}
const f=(w,s,fam)=>w+' '+s+'px '+(fam||ML);
function elems(){
  const E=[];
  E.push({logo:true,gap:6});
  E.push({t:D.masjid,s:25,w:'700',al:'c',gap:3});
  E.push({t:D.reg,s:14,w:'600',al:'c',gap:3});
  E.push({t:D.place,s:15,w:'400',al:'c',gap:9});
  E.push({sep:true,gap:9});
  E.push({t:D.fund,s:23,w:'700',al:'c',gap:11});
  E.push({inforow:true, L:[['Receipt No: ',D.receipt],['Date: ',D.date]], R:'ID: '+D.id, gap:13});
  E.push({t:D.name,s:24,w:'700',al:'l',gap:2});
  E.push({t:D.house,s:18,w:'400',al:'l',gap:13});
  E.push({t:'തുക: ₹ '+D.amount,s:27,w:'700',al:'l',gap:4});
  if(D.dues && +D.dues>0) E.push({t:'കുടിശ്ശിക: ₹ '+D.dues,s:18,w:'400',al:'l',gap:8});
  E.push({rblock:true, lines:[[D.by?'കൈപ്പറ്റിയത്':'',14,'400'],[D.by,15,'600']], gap:11});
  E.push({sep:true,gap:11});
  E.push({t:"'"+D.dua_ml+"'",s:17,w:'600',al:'c',gap:3});
  E.push({t:D.dua_ar,s:16,w:'400',al:'c',fam:AR,gap:2});
  return E;
}
function measureH(E){
  const padTop=18,padBot=20,extra=6;
  const logoW=46, logoH=logoImg?Math.round(logoImg.height*logoW/logoImg.width):0;
  let h=padTop;
  E.forEach(e=>{
    if(e.logo) h+=logoH+e.gap+extra;
    else if(e.sep) h+=1+e.gap+extra;
    else if(e.inforow) h+=2*18+4+e.gap+extra;
    else if(e.rblock) h+=e.lines.length*19+e.gap+extra;
    else h+=e.s+e.gap+extra;
  });
  return {h:Math.round(h+padBot),padTop,extra,logoW,logoH};
}
async function draw(){
  await loadLogo();
  const c=canvas.getContext('2d');
  const E=elems();
  try{await document.fonts.ready;await Promise.all([f('700',25),f('700',27),f('400',16,AR)].map(ff=>document.fonts.load(ff,'അആ₹صدقة0')));}catch(e){}
  const m=measureH(E);
  canvas.width=W; canvas.height=m.h;
  c.fillStyle='#fff';c.fillRect(0,0,W,m.h);c.fillStyle='#000';c.textBaseline='top';
  let y=m.padTop;
  E.forEach(e=>{
    if(e.logo){ if(logoImg)c.drawImage(logoImg,(W-m.logoW)/2,y,m.logoW,m.logoH); y+=m.logoH+e.gap+m.extra; return; }
    if(e.sep){ c.save();c.strokeStyle='#000';c.lineWidth=1;c.setLineDash([2,3]);c.beginPath();c.moveTo(PADX,y+0.5);c.lineTo(W-PADX,y+0.5);c.stroke();c.restore(); y+=1+e.gap+m.extra; return; }
    if(e.inforow){
      const lh=18; c.textAlign='left';
      e.L.forEach((pair,i)=>{ const yy=y+i*lh; c.font=f('400',13); c.fillText(pair[0],PADX,yy); const lw=c.measureText(pair[0]).width; c.font=f('700',13); c.fillText(pair[1],PADX+lw,yy); });
      c.font=f('700',15); const tw=c.measureText(e.R).width; const bpad=8, boxW=tw+bpad*2, boxH=24, bx2=W-PADX, bx1=bx2-boxW, by=y+(2*lh-boxH)/2;
      c.lineWidth=1.5;c.strokeStyle='#000';
      if(c.roundRect){c.beginPath();c.roundRect(bx1,by,boxW,boxH,5);c.stroke();}else{c.strokeRect(bx1,by,boxW,boxH);}
      c.textAlign='left';c.fillText(e.R,bx1+bpad,by+(boxH-15)/2);
      y+=2*lh+4+e.gap+m.extra; return;
    }
    if(e.rblock){ c.textAlign='right'; let yy=y; e.lines.forEach(ln=>{ if(!ln[0])return; c.font=f(ln[2],ln[1]); c.fillText(ln[0],W-PADX,yy); yy+=19; }); y+=e.lines.length*19+e.gap+m.extra; return; }
    c.font=f(e.w,e.s,e.fam);
    if(e.al==='c'){c.textAlign='center';c.fillText(e.t,W/2,y,W-PADX*2);}
    else{c.textAlign='left';c.fillText(e.t,PADX,y,W-PADX*2);}
    y+=e.s+e.gap+m.extra;
  });
}
function escposFromCanvas(){
  const w=canvas.width,h=canvas.height;
  const data=canvas.getContext('2d').getImageData(0,0,w,h).data;
  const bpr=Math.ceil(w/8); const raster=new Uint8Array(bpr*h);
  for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++){ const i=(yy*w+xx)*4; const a=data[i+3]; const lum=0.299*data[i]+0.587*data[i+1]+0.114*data[i+2]; if(a>128&&lum<128) raster[yy*bpr+(xx>>3)]|=(0x80>>(xx&7)); }
  const xL=bpr&0xff,xH=(bpr>>8)&0xff,yL=h&0xff,yH=(h>>8)&0xff;
  const head=[0x1B,0x40,0x1D,0x76,0x30,0x00,xL,xH,yL,yH], tail=[0x0A,0x0A,0x0A,0x0A];
  const out=new Uint8Array(head.length+raster.length+tail.length);
  out.set(head,0);out.set(raster,head.length);out.set(tail,head.length+raster.length);
  return out;
}
function b64(bytes){let s='';const ch=8192;for(let i=0;i<bytes.length;i+=ch)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+ch));return btoa(s);}
document.getElementById('btnPick').addEventListener('click',()=>{ if(N&&N.selectPrinter){N.selectPrinter();setStatus('Pick the Veer…','');} else setStatus('Open inside the HIM Collector app.','err'); });
document.getElementById('btnPrint').addEventListener('click',()=>{ if(!(N&&N.print)){setStatus('Open inside the HIM Collector app.','err');return;} try{setStatus('Printing…','');N.print(b64(escposFromCanvas()));}catch(e){setStatus('✗ '+e.message,'err');} });
document.getElementById('btnOpen').addEventListener('click',()=>{ if(N&&N.collectorUrl){location.href=N.collectorUrl();} });
draw();
</script>
</body>
</html>
